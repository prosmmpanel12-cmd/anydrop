plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-parcelize'
}

android {
    namespace 'com.anydrop.restaurant'
    compileSdk 34

    defaultConfig {
        applicationId "com.anydrop.restaurant"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "0.1-phase3"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    // Crop screen (app-owner feedback item #2, 2026-08-17) — reads EXIF
    // orientation on picked photos so a sideways camera photo doesn't
    // crop sideways. AndroidX artifact, no new Maven repo needed (same
    // google()/mavenCentral() this project already declares).
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.2.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.7.0'
    implementation 'androidx.fragment:fragment-ktx:1.6.2'

    // Networking — talks to the same Phase 1/3 PHP/MySQL backend as the customer app
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // Image loading for menu item photo thumbnails (image_url) — §5 of the
    // UI plan. Same version the Customer app already uses.
    implementation 'io.coil-kt:coil:2.6.0'

    // SVG decoding for the category-icon live-search grid (Phase 1,
    // 2026-08-19 UI/UX overhaul) — Iconify search results are served as
    // .svg, this lets Coil preview them directly and lets
    // CategoryIconSearchAdapter rasterize a picked one to a local PNG via
    // the same ImageLoader. Same major version as the base coil artifact
    // above, per coil-svg's own compatibility table.
    implementation 'io.coil-kt:coil-svg:2.6.0'

    // Location picker for Edit Profile (app-owner real-device feedback,
    // 2026-08-16, docs/restorent/00_Status.md item 3) — reuses the Customer
    // app's H6 pin-drop pattern/dependency, same version.
    implementation 'com.google.android.gms:play-services-maps:19.1.0'
}
