name: Build Anydrop APKs

on:
  push:
    branches: [ master ]
  workflow_dispatch: {}

jobs:
  build-customer:
    name: Build Customer App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4

      - name: Build customer debug APK
        working-directory: customer
        run: gradle assembleDebug --stacktrace

      - name: Upload customer APK
        uses: actions/upload-artifact@v4
        with:
          name: anydrop-customer-debug
          path: customer/app/build/outputs/apk/debug/*.apk

  build-restaurant:
    name: Build Restaurant App
    runs-on: ubuntu-latest
