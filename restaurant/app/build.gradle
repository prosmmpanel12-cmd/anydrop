plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-parcelize'
    // FCM push + Analytics (this session) — must come after the Android/
    // Kotlin plugins per Google's own setup docs; reads app/google-services.json.
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.anydrop.restaurant'
    compileSdk 34

    defaultConfig {
        applicationId "com.anydrop.restaurant"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "0.1-phase3"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        debug {
            // Shared, repo-committed debug keystore (see /keystore at
            // repo root) so every CI run — and every dev machine — signs
            // debug builds with the SAME key. Without this, each fresh
            // GitHub Actions runner auto-generates its own throwaway
            // ~/.android/debug.keystore, so every CI build has a
            // different signature and Android refuses to install over
            // the previous one ("App not installed" / forces an
            // uninstall first). This is a debug-only key — not sensitive,
            // fine to commit (same convention as Android's own default
            // debug keystore password).
            storeFile rootProject.file('../keystore/anydrop-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    // Crop screen (app-owner feedback item #2, 2026-08-17) — reads EXIF
    // orientation on picked photos so a sideways camera photo doesn't
    // crop sideways. AndroidX artifact, no new Maven repo needed (same
    // google()/mavenCentral() this project already declares).
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.2.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.7.0'
    implementation 'androidx.fragment:fragment-ktx:1.6.2'

    // Networking — talks to the same Phase 1/3 PHP/MySQL backend as the customer app
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // Image loading for menu item photo thumbnails (image_url) — §5 of the
    // UI plan. Same version the Customer app already uses.
    implementation 'io.coil-kt:coil:2.6.0'

    // SVG decoding for the category-icon live-search grid (Phase 1,
    // 2026-08-19 UI/UX overhaul) — Iconify search results are served as
    // .svg, this lets Coil preview them directly and lets
    // CategoryIconSearchAdapter rasterize a picked one to a local PNG via
    // the same ImageLoader. Same major version as the base coil artifact
    // above, per coil-svg's own compatibility table.
    implementation 'io.coil-kt:coil-svg:2.6.0'

    // Location picker for Edit Profile (app-owner real-device feedback,
    // 2026-08-16, docs/restorent/00_Status.md item 3) — reuses the Customer
    // app's H6 pin-drop pattern/dependency, same version.
    implementation 'com.google.android.gms:play-services-maps:19.1.0'

    // ---- FCM push + Analytics (this session) ----
    // BoM pins every com.google.firebase:* artifact below to mutually
    // compatible versions — no version number needed on the individual
    // firebase-* lines, same convention Firebase's own setup docs use.
    implementation platform('com.google.firebase:firebase-bom:33.1.2')
    implementation 'com.google.firebase:firebase-messaging-ktx'
    implementation 'com.google.firebase:firebase-analytics'
}
