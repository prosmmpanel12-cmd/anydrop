plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-parcelize'
    // FCM push (doc 99/100 backend, Android side) — reads
    // app/google-services.json (added 2026-09-05, doc 104, for
    // com.anydrop.rider).
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.anydrop.rider'
    compileSdk 34

    defaultConfig {
        applicationId "com.anydrop.rider"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "0.1-phase1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        debug {
            // Shared, repo-committed debug keystore (see /keystore at
            // repo root) so every CI run — and every dev machine — signs
            // debug builds with the SAME key. Without this, each fresh
            // GitHub Actions runner auto-generates its own throwaway
            // ~/.android/debug.keystore, so every CI build has a
            // different signature and Android refuses to install over
            // the previous one ("App not installed" / forces an
            // uninstall first). This is a debug-only key — not sensitive,
            // fine to commit (same convention as Android's own default
            // debug keystore password).
            storeFile rootProject.file('../keystore/anydrop-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.7.0'

    // Networking — same Phase 1 PHP/MySQL backend the customer/restaurant apps use
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // GPS auto-detect for the service-area picker on signup (Phase 1 scope,
    // doc 79 — "live location fetch AND dropdown, both")
    implementation 'com.google.android.gms:play-services-location:21.2.0'

    // Document upload (vehicle doc / ID doc) and Google Maps SDK for live
    // tracking are intentionally NOT added yet — those belong to the
    // post-approval "Complete Profile" step and Phase 2's delivery flow
    // respectively, neither of which is in scope for this signup/login pass.

    // EarningsActivity (deep-plan §19-20, doc 90's "natural next slice")
    // — the rider app's first RecyclerView-based list screen, so these
    // three weren't needed until now. Same versions as the customer
    // app's own build.gradle, not re-guessed.
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'

    // Firebase push token registration + notification bell (deep-plan
    // §23, docs 99-102). Same BOM/artifact versions as the customer
    // app's own build.gradle, not re-guessed — see that file's own
    // comment for why firebase-messaging-ktx over the plain artifact.
    implementation platform('com.google.firebase:firebase-bom:33.1.2')
    implementation 'com.google.firebase:firebase-messaging-ktx'

    // Image loading (Rider Order Detail, deep-plan §9, this session) —
    // first time this app has needed to load a remote image (the
    // customer's address photo, when one was captured on the customer
    // app's H6 door-photo feature). Same version as the customer app's
    // own build.gradle, not re-guessed.
    implementation 'io.coil-kt:coil:2.6.0'
}
