// Top-level build file
plugins {
    id 'com.android.application' version '8.2.2' apply false
    id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
    // FCM push (doc 99/100's backend + Android side) — reads
    // app/google-services.json, same plugin/version the
    // customer/restaurant apps already use. google-services.json for
    // com.anydrop.rider was registered and added 2026-09-05 (doc 104) —
    // no longer a build blocker.
    id 'com.google.gms.google-services' version '4.4.1' apply false
}
